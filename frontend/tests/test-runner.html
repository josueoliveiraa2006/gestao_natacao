<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Execução de Testes Unitários - Frontend Natação</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f8fafc;
      padding: 40px;
      color: #1e293b;
    }
    .container {
      max-width: 700px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
    }
    h1 {
      font-size: 22px;
      margin-bottom: 8px;
    }
    p {
      color: #64748b;
      font-size: 14px;
      margin-bottom: 24px;
    }
    .btn-run {
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 10px 18px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 20px;
    }
    .btn-run:hover {
      background: #0369a1;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🧪 Suíte de Testes Unitários (JavaScript Puro)</h1>
    <p>Testes automatizados das regras de validação de dados e limites do campeonato de natação.</p>
    <button class="btn-run" id="btn-execute">Re-executar Testes</button>
    <div id="test-reporter">Carregando testes...</div>
  </div>

  <script type="module">
    import { runTests } from './validators.test.js';

    const reporterEl = document.getElementById('test-reporter');
    const btnExecute = document.getElementById('btn-execute');

    runTests(reporterEl);
    btnExecute.addEventListener('click', () => runTests(reporterEl));
  </script>
</body>
</html>
